name: build-native-virtual-camera

# Minimal native build for the modified LocalCam virtual camera (1920x1080).
# Mirrors the native portion of scripts/Build-Release.ps1:
#   1. MSBuild  VirtualCameraMediaSource.vcxproj  (x64 Release, NuGet packages.config restore)
#   2. CMake    registrar + capability probe
# Artifacts are uploaded for manual download. No release publish, no signing.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (media source)
        run: msbuild "src\LocalCam.VirtualCamera\vendor\Windows-Camera\Samples\VirtualCamera\VirtualCameraMediaSource\VirtualCameraMediaSource.vcxproj" /t:Restore /p:RestorePackagesConfig=true

      - name: Build media source DLL (x64 Release)
        run: msbuild "src\LocalCam.VirtualCamera\vendor\Windows-Camera\Samples\VirtualCamera\VirtualCameraMediaSource\VirtualCameraMediaSource.vcxproj" /p:Configuration=Release /p:Platform=x64 /m

      - name: Build registrar + capability probe (CMake)
        run: |
          cmake -S src/LocalCam.VirtualCamera -B artifacts/native-build -G "Visual Studio 17 2022" -A x64
          cmake --build artifacts/native-build --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          $live = "artifacts/virtual-camera/live"
          New-Item -ItemType Directory -Force -Path $live | Out-Null
          Copy-Item "src/LocalCam.VirtualCamera/vendor/Windows-Camera/Samples/VirtualCamera/VirtualCameraMediaSource/x64/Release/VirtualCameraMediaSource.dll" "$live/LocalCamMediaSource.dll"
          Copy-Item "artifacts/native-build/Release/LocalCamVirtualCameraRegistrar.exe" $live
          Copy-Item "artifacts/native-build/Release/LocalCamVirtualCameraCapabilityProbe.exe" $live
          Get-ChildItem $live | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localcam-native-x64
          path: artifacts/virtual-camera/live/
          if-no-files-found: error
