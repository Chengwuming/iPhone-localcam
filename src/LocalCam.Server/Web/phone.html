<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111614">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg">
<title>DeskCam</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecf4ef;background:#111614;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 28px}h1{font-size:30px;letter-spacing:-1px;margin:0}header span{color:#91a89a;font-size:13px}
video{width:100%;height:40vh;object-fit:contain;background:#080b09;border-radius:14px}
#status{font-size:18px;line-height:1.5;min-height:54px;margin:22px 0 16px}
button{font:inherit;border:0;border-radius:12px;padding:17px;width:100%;font-weight:650;background:#b9edcf;color:#123b25}
button:disabled{opacity:.45}button.stop{background:#35453c;color:#edf5ef}
p.note{font-size:13px;color:#9cad9f;line-height:1.7}details{color:#8ba294;font-size:12px;margin-top:24px}pre{white-space:pre-wrap;line-height:1.8}
a{color:#b9edcf}
select,input[type=range]{width:100%;font:inherit;margin:8px 0 12px}select{padding:10px;border:1px solid #607567;border-radius:8px;background:#29392f;color:#ecf4ef}
.panel{margin-top:20px;padding:16px;background:#1d2b22;border-radius:12px}.panel button{margin-top:10px;padding:12px}.panel label{display:block;font-size:14px}.panel .note{margin:6px 0 14px}[hidden]{display:none!important}#photo-status{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><h1>DeskCam</h1><span>桌面 · 实时</span></header>
<video id="camera" muted autoplay playsinline></video>
<p id="status">正在检查连接…</p>
<button id="start" disabled>开始拍摄</button>
<section class="panel" aria-label="画质和相机控制">
<label for="quality">实时清晰度</label><select id="quality"><option value="paper">纸面清晰 1080p · 15 fps</option><option value="balanced">标准 1080p · 20 fps</option><option value="economy">省流 720p · 20 fps</option></select>
<p class="note">纸面模式提高编码质量；失焦不会因提高码率而变清楚。设置会保存。</p>
<label for="focus-mode">对焦方式</label><select id="focus-mode" disabled><option>等待相机能力</option></select>
<div id="focus-range" hidden><label for="focus-distance">手动焦点位置 <output id="focus-value"></output></label><input id="focus-distance" type="range"></div>
<button id="refocus" class="stop" disabled>重新自动对焦</button><p id="focus-status" class="note">是否清晰需要看实际纸面，模式状态不等于已经对焦成功。</p>
<label for="camera-zoom">相机倍率 <output id="zoom-value"></output></label><input id="camera-zoom" type="range" disabled><p id="zoom-status" class="note">等待相机能力。这项控制手机采集端倍率，不是电脑裁剪。</p>
</section>
<section class="panel" aria-label="高分辨率照片">
<button id="capture-hd" disabled>Capture HD · 拍照到电脑</button>
<button id="system-photo" class="stop">系统相机拍照</button><input id="photo-file" type="file" accept="image/*" capture="environment" hidden>
<p id="photo-status" class="note">拍摄完整照片，电脑弹窗可放大、旋转、复制和保存。拍照时实时画面可能短暂停顿。</p>
</section>
<p class="note">把手机放到支架上，保持此页面在前台。画面只传到你的电脑。<br>旋转、裁剪和截图在电脑上操作。</p>
<p id="install" class="note" hidden>首次连接成功后，可以从 Safari 的分享菜单将 DeskCam 添加到主屏幕。</p>
<details><summary>连接信息</summary><pre id="metrics">等待拍摄</pre><pre id="capabilities">等待相机能力</pre><p>停止后可以正常使用手机；再次打开即可连接。</p></details>
<script type="module" src="/phone.js"></script>
</body></html>
